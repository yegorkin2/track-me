plugins {
    id 'org.springframework.boot' version '3.4.4'
    id 'io.freefair.lombok' version '8.14'
    id 'checkstyle'
    id "org.sonarqube" version "7.2.3.7755"
}

sonar {
    properties {
        property "sonar.language", "java"
        property "sonar.projectKey", "yegorkin2_track-me"
        property "sonar.organization", "yegorkin2"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.java.checkstyle.reportPaths", "build/reports/checkstyle/main.xml,build/reports/checkstyle/test.xml"
        property "sonar.login", System.getenv("SONAR_TOKEN")
    }
}


gradle.startParameter.parallelProjectExecutionEnabled = true

subprojects {
    group = 'net.trackme'
    version = '0.0.3-SNAPSHOT'

    repositories {
        mavenCentral()
    }

    apply plugin: 'checkstyle'

    checkstyle {
        toolVersion = '10.12.5'
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        ignoreFailures = true  // Set to false to fail build on violations
        maxWarnings = Integer.MAX_VALUE  // Set to 0 to fail on any warnings
    }

    tasks.withType(Checkstyle).configureEach {
        reports {
            xml.required = true
            html.required = true
        }
    }
}